
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesta</title>
    <style>
    

        body {
           
            display: flex;
            align-items: center;
            font-family: Arial, sans-serif;
             background: linear-gradient(120deg, #286d9f, #9bcde2);
        }
        .marco {
            height: 870px;
            width: 1800px;
            padding: 28px 24px;
            background: linear-gradient(120deg, #286d9f, #9bcde2);
            display: flex;
        }
        .contenido {
            width: 2700px;
            background-color: #fffdf8;
            border-radius: 30px;
            padding: 30px 35px;
            display: grid;
            gap: 25px;
        }

        h1 {
            color: #286f9f;
            font-family: Impact, "Arial Narrow", sans-serif;
            font-size: 150px;
            font-weight: bold;
            margin-top: 80px;
            margin-left: 60px;
        }

        .descripcion {
            width: 600px;
            height: 300px;
            background-color: #8fc2dc;
            color: white;
            border-radius: 24px;
            padding: 25px;
            font-size: 32px;
            margin-top: 100px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            margin-left: 60px;
        }
    #kk1{
       position: relative;
       bottom: 800px;
       left: 1200px;
        width: 400px;
    height: 400px;
    border-radius: 360px;
    }

#kk2{
    position: relative;
    left: 800px;
    bottom: 700px;
    width: 400px;
    height: 400px;
    border-radius: 360px;
}


       
        @media (max-width: 760px) {
            .contenido {
            
                padding: 28px 22px;
            }
            h1 {
                font-size: 120px;
            }
            .descripcion {
                font-size:30px;
            }
            
 }
    </style>
</head>
<body>
    <main class="marco">
        <section class="contenido">
            <div class="p">
                <h1>PROPUESTA</h1>
                <p class="descripcion">
                    El proyecto propone la mejora integral del área de
                    enfermería garantizando la atención inmediata y
                    profesional ante emergencias escolares, además
                    de promover hábitos de prevención, autocuidado
                    y bioseguridad entre estudiantes del Colegio
                    Pedro Poveda.
                </p>
            </div>
           
            <img id="kk2"src="enf1.jpg">
            <img  id="kk1"src="enferm.jpg">
            </div>
        </section>
    </main>
</body>
</html>
