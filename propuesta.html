
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f1f2f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .marco {
            width: 92%;
            max-width: 1100px;
            min-height: 595px;
            padding: 28px 24px;
            background: linear-gradient(120deg, #286d9f, #9bcde2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .contenido {
            width: 100%;
            min-height: 515px;
            background-color: #fffdf8;
            border-radius: 30px;
            padding: 30px 35px;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            gap: 25px;
            align-items: center;
            overflow: hidden;
        }
        .texto {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        h1 {
            color: #286f9f;
            font-family: Impact, "Arial Narrow", sans-serif;
            font-size: 86px;
            font-weight: bold;
            letter-spacing: -2px;
            margin-bottom: 30px;
        }

        .descripcion {
            width: 100%;
            max-width: 475px;
            background-color: #8fc2dc;
            color: white;
            border-radius: 24px;
            padding: 10px 12px 24px;
            font-size: 18px;
            line-height: 1.45;
        }
        .frase {
            margin-top: 30px;
            margin-left: 16px;
            background-color: #fffef4;
            color: #222;
            padding: 22px 26px;
            max-width: 390px;
            font-family: "Arial Black", Arial, sans-serif;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.25;
        }
        .visual {
            position: relative;
            min-height: 420px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .forma {
            position: absolute;
            background-color: #8ab5d0;
            z-index: 0;
        }
        .forma.uno {
            width: 190px;
            height: 300px;
            top: 35px;
            left: 18%;
            border-radius: 55% 35% 45% 30%;
            transform: rotate(18deg);
        }
        .forma.dos {
            width: 180px;
            height: 270px;
            right: 12%;
            bottom: 10px;
            border-radius: 45% 50% 35% 45%;
            transform: rotate(18deg);
        }
        .foto {
            position: absolute;
            border-radius: 50%;
            object-fit: cover;
            z-index: 1;
        }
        .foto.superior {
            width: 260px;
            height: 260px;
            top: 0;
            left: 5%;
        }

        .foto.inferior {
            width: 195px;
            height: 195px;
            right: 5%;
            bottom: 0;
        }
        .play {
            position: absolute;
            z-index: 2;
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: rgba(20, 25, 35, 0.72);
            display: grid;
            place-items: center;
        }
        .play::after {
            content: "";
            margin-left: 5px;
            width: 0;
            height: 0;
            border-top: 17px solid transparent;
            border-bottom: 17px solid transparent;
            border-left: 23px solid white;
        }
        .play.superior {
            top: 97px;
            left: calc(5% + 97px);
        }
        .play.inferior {
            right: calc(5% + 64px);
            bottom: 64px;
        }
        @media (max-width: 760px) {
            .contenido {
                grid-template-columns: 1fr;
                padding: 28px 22px;
            }
            h1 {
                font-size: 58px;
            }
            .descripcion {
                font-size: 16px;
            }
            .visual {
                min-height: 360px;
            }

            .foto.superior {
                width: 220px;
                height: 220px;
            }
            .foto.inferior {
                width: 165px;
                height: 165px;
            }
        }
    </style>
</head>
<body>
    <main class="marco">
        <section class="contenido">
            <div class="texto">
                <h1>PROPUESTA</h1>
                <p class="descripcion">
                    El proyecto propone la mejora integral del área de
                    enfermería garantizando la atención inmediata y
                    profesional ante emergencias escolares, además
                    de promover hábitos de prevención, autocuidado
                    y bioseguridad entre estudiantes del Colegio
                    Pedro Poveda.
                </p>
            </div>
            <div class="visual">
                <div class="forma uno"></div>
                <div class="forma dos"></div>
                <img src=".jpg" class="foto superior"
                     alt="Atención de enfermería">
                <span class="play superior"></span>
                <img src="enfermeria2.jpg" class="foto inferior" alt="Personal de enfermería">
                <span class="play inferior"></span>
            </div>
        </section>
    </main>
</body>
</html>
