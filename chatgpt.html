
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 2%;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* CONTENEDOR PRINCIPAL */
        .pagina {
            background: linear-gradient(110deg, rgb(32,110,166), rgb(184,225,241));
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            grid-template-areas:
                "info formulario"
                "footer footer";
            min-height: 100vh;
        }

        /* INFORMACIÓN DE CONTACTO */
        .contenedor {
            grid-area: info;
            padding: 20px 35px 50px 45px;
        }

        h1 {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 85px;
            font-weight: 900;
            margin: 0 0 30px 0;
        }

        .caja {
            display: flex;
            align-items: center;
            background-color: rgb(184,225,241);
            border: 1px solid rgb(32,110,166);
            border-radius: 60px;
            padding: 10px;
            height: 100px;
            width: 100%;
            max-width: 510px;
            margin-bottom: 15px;
        }

        .icono {
            background-color: rgb(32,110,166);
            color: white;
            width: 75px;
            height: 75px;
            min-width: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .informacion {
            margin-left: 15px;
        }

        .informacion h2 {
            color: rgb(32,110,166);
            font-size: 30px;
            font-weight: normal;
            margin: 0;
        }

        .informacion p {
            color: white;
            font-size: 23px;
            margin: 2px 0 0;
        }

        /* FORMULARIO */
        .formulario {
            grid-area: formulario;
            background-color: #fffaf5;
            border-radius: 35px;
            padding: 20px 30px;
            width: 75%;
            max-width: 450px;
            margin: 40px auto 25px;
        }

        .campo {
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: rgb(32,110,166);
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            border: 1px solid rgb(160,195,220);
            border-radius: 6px;
            padding: 10px;
            background-color: transparent;
            outline: none;
            font-size: 15px;
        }

        input {
            height: 40px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border: 2px solid rgb(32,110,166);
        }

        /* VALORACIÓN */
        .valoracion {
            margin-bottom: 10px;
        }

        .estrellas {
            display: flex;
            gap: 6px;
        }

        .estrellas input {
            display: none;
        }

        .estrellas label {
            background-color: #e4e9ed;
            color: rgb(32,110,166);
            flex: 1;
            height: 53px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-size: 27px;
            cursor: pointer;
            margin: 0;
        }

        .estrellas input:checked + label {
            background-color: rgb(32,110,166);
            color: white;
        }

        /* BOTÓN */
        button {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 30px;
            background-color: rgb(32,110,166);
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 0;
        }

        button:hover {
            background-color: rgb(209,48,77);
        }

        .aviso {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 9px;
            color: rgb(32,110,166);
            margin-top: 8px;
        }

        /* PIE DE PÁGINA */
        footer {
            grid-area: footer;
            background-color: rgb(209,48,77);
            min-height: 90px;
            display: flex;
            align-items: center;
            padding: 15px 35px;
            color: white;
        }

        .logo {
            width: 56px;
            height: 56px;
            background-color: white;
            color: rgb(209,48,77);
            border: 2px solid rgb(32,110,166);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-right: 12px;
        }

        .nombre-logo {
            font-family: Georgia, serif;
            font-size: 20px;
            font-weight: bold;
            line-height: 18px;
        }

        .nombre-logo span {
            display: block;
            font-size: 16px;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            .pagina {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "info"
                    "formulario"
                    "footer";
            }

            .contenedor {
                padding: 25px;
            }

            h1 {
                font-size: 55px;
            }

            .formulario {
                width: 90%;
                margin: 10px auto 30px;
            }

            .caja {
                max-width: 100%;
            }

            .informacion p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="pagina">

    <!-- INFORMACIÓN -->
    <section class="contenedor">

        <h1>CONTÁCTANOS</h1>

        <div class="caja">
            <div class="icono">☎</div>
            <div class="informacion">
                <h2>TELÉFONO</h2>
                <p>+591 60771477</p>
            </div>
        </div>

        <div class="caja">
            <div class="icono">✉</div>
            <div class="informacion">
                <h2>CORREO</h2>
                <p>barjou@pedropoveda.edu.bo</p>
            </div>
        </div>

        <div class="caja">
            <div class="icono">♟</div>
            <div class="informacion">
                <h2>DIRECCIÓN</h2>
                <p>Colegio Pedro Poveda, CBBA - Bolivia</p>
            </div>
        </div>

    </section>

    <!-- FORMULARIO -->
    <form class="formulario">

        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required>
        </div>

        <div class="campo">
            <label for="gmail">Gmail</label>
            <input type="email" id="gmail" required>
        </div>

        <div class="campo">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" required></textarea>
        </div>

        <div class="valoracion">
            <label>Servicio</label>

            <div class="estrellas">
                <input type="radio" name="servicio" id="uno" value="1">
                <label for="uno">☹</label>

                <input type="radio" name="servicio" id="dos" value="2">
                <label for="dos">☹</label>

                <input type="radio" name="servicio" id="tres" value="3">
                <label for="tres">😐</label>

                <input type="radio" name="servicio" id="cuatro" value="4">
                <label for="cuatro">☺</label>

                <input type="radio" name="servicio" id="cinco" value="5">
                <label for="cinco">☻</label>
            </div>
        </div>

        <button type="submit"></button>

        <div class="aviso">
            Your Canva profile name will be shared. Never submit passwords.
            <br>
            <u>Learn how we handle your data</u>
        </div>

    </form>

    <!-- PIE DE PÁGINA -->
    <footer>

        <div class="logo">✚</div>

        <div class="nombre-logo">
            ENFERMERÍA
            <span>Colegio Pedro Poveda</span>
        </div>

    </footer>

</div>

</body>
</html>
