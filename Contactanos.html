<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet">
    <style>
                                        /*MENÚ*/
        header{            
            align-items: center;
            align-content: center;
            grid-area: cero;
        }

        nav{
            display: flex;
            justify-content: center;
            gap: 20px;
            border: 2px solid rgb(209 48 77);
            background-color: rgb(255, 255, 255);
            padding-right: 25px;
            padding-left: 25px;
            padding-top: 12px;
            padding-bottom: 12px;
            border-radius: 60px;
            width: 1000px;
            margin: 0 auto;
        }


        a{
            background-color: rgb(255, 255, 255);
            border-radius: 60px;
            border: 2px solid rgb(209 48 77);
            padding:15px;
            color: rgb(209 48 77);
            text-decoration: none;
            width: 150px;
            font-size: 25px;
            justify-content: center;
            justify-items: center;
            font-family: 'Passion One', sans-serif;
            text-align: center;
        }


        a:hover{
            background-color: rgb(209 48 77);
            color: rgb(255, 255, 255);
            size: 10px;
            transform: scale(1.1);
        }
        /* BODY */
       body{
            background: linear-gradient(110deg,rgb(32, 110, 166), rgb(184, 225, 241));
            display: grid;
            grid-template-columns: auto;
            grid-template-rows: 500px 500px;
            grid-template-areas:
            "cero cero"
            "uno dos";
        }
        /* INFORMACIÓN */
        .contenedor {
            grid-area: uno;
            flex-direction: column;
            gap: 15px;
            width: 505px;
            margin-left: 100px;
        }

        .caja {
            display: flex;
            align-items: center;
            background-color: rgb(184, 225, 241);
            border: 1px solid rgb(32, 110, 166);
            border-radius: 60px;
            padding: 10px;
            height: 100px;
            width: 600px;
        }

        .icono {
            background-color: rgb(32, 110, 166);
            color: white;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .informacion {
            margin-left: 15px;
        }

        .informacion h2 {
            color: rgb(32, 110, 166);
            font-size: 40px;;
            font-weight: normal;
            margin: 0;
            font-family: 'cocomat-pro', sans-serif;
            font-weight: 700;
        }

        .informacion p {
            color: white;
            font-size: 27px;;
            margin: 0;
            font-family: 'cocomat-pro', sans-serif;
            font-weight: 700;
        }

        /* FORMULARIO */
        .form{
            grid-area: dos;
        }

/* PIE DE PÁGINA */
        footer{
            background-color: rgb(209 48 77);
        }

    </style>
</head>

<header>
<nav>

    <a href="contactanos.html">Contactanos</a>
</nav>
</header>

        </div>
    </div>

    <div class="caja">
        <div class="icono">✉</div>
        <div class="informacion">

    <div class="caja">

    </div>

    <div class="form">
        <form action="">
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre">
            <br>
            <label for="correo">Correo:</label>
            <input type="email" name="correo" id="correo">
            <br>
            <label for="mensaje">Mensaje:</label>
            <textarea name="mensaje" id="mensaje" cols="30" rows="10"></textarea>

            <input type="submit" value="Enviar">
        </form>
