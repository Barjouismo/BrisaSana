    <style>
                                        /*MENÚ*/
        header{            
            grid-area: cero;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
        }

        nav{
            display: flex;
            justify-content: center;
            gap: 20px;
            border: 2px solid rgb(209 48 77);
            background-color: rgb(255, 255, 255);
            padding-right: 25px;
            padding-left: 25px;
            padding-top: 12px;
            padding-bottom: 12px;
            border-radius: 60px;
            width: 1000px;
            margin: 0 auto;
        }


        a{
            background-color: rgb(255, 255, 255);
            border-radius: 60px;
            border: 2px solid rgb(209 48 77);
            padding:15px;
            color: rgb(209 48 77);
            text-decoration: none;
            width: 150px;
            font-size: 25px;
            justify-content: center;
            justify-items: center;
            font-family: 'Passion One', sans-serif;
            text-align: center;
        }


        a:hover{
            background-color: rgb(209 48 77);
            color: rgb(255, 255, 255);
            size: 10px;
            transform: scale(1.1);
            position: relative;
            bottom: 7px;
            transition: 0.3s;
        }
        /* BODY */
        
       body{
            background: linear-gradient(110deg,rgb(32, 110, 166), rgb(184, 225, 241));
            display: grid;
            padding: 0;
            margin: 0;
            grid-template-columns: auto auto;
            grid-template-rows: 150px auto auto auto;
            grid-template-areas:
            "cero cero"
            "we dos"
            "uno dos"
            "tre tre";
        }
        /* INFORMACIÓN */

        h1{
            font-family: 'Passion One', sans-serif;
            font-size: 130px;
            color: white;
            margin-left: 180px;
            grid-area: we;
            margin-bottom: 0px;
            margin-top: 15px;
        }

        .contenedor {
            grid-area: uno;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-left: 200px;
        }

        .caja {
            display: flex;
            align-items: center;
            background-color: rgb(184, 225, 241);
            border: 1px solid rgb(32, 110, 166);
            border-radius: 70px;
            padding: 10px;
            height: 110px;
            width: 700px;
        }

        .icono {
            background-color: rgb(32, 110, 166);
            color: white;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .informacion {
            margin-left: 15px;  
        }

        .informacion h2 {
            color: rgb(32, 110, 166);
            font-size: 40px;
            font-weight: normal;
            margin: 0;
            font-family: 'cocomat-pro', sans-serif;
            font-weight: 700;
        }

        .informacion p {
            color: white;
            font-size: 31px;
            margin: 0;
            font-family: 'cocomat-pro', sans-serif;
            font-weight: 700;
        }

        /* FORMULARIO */
        .form{
            grid-area: dos;
            background-color: white;
            border-radius: 60px;
            padding: 20px;
            margin-top: 15px;
            margin-right: 150px;
            width: 557px;
            align-items: center;
            justify-content: center;
        }

        label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-family: "DM Serif Display", serif;
            font-weight: 700;
            color:  rgb(32, 110, 166);
            font-size: 25px;
        }

        input{
            width: 550px;
            border: 1px solid rgb(160,195,220);
            border-radius: 5px;
            margin-bottom: 20px;
            height: 50px;
        }

        textarea{
            width: 550px;
            border: 1px solid rgb(160,195,220);
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .enviar{
            background-color: rgb(32, 110, 166);
            color: rgb(255, 255, 255);
            font-family: "DM Serif Display", serif;
            width: 560px;
            
        }

        .enviar:hover{
            background-color: rgb(184, 225, 241);
            color: rgb(32, 110, 166);
            size: 10px;
            transition: 0.2s;
        }

/* PIE DE PÁGINA */
        footer{
            background-color: rgb(209 48 77);
            font-family: "DM Serif Display", serif;
            grid-area: tre;
            padding: 30px;
            margin-top: 103px;
            display: flex;
            align-items: center;
            border-radius: 30px 30px 0 0;
            height: 50px;
        }

        .logo{
            background-color: white;
            border-radius: 70px;
            width: 230px;
            height: 50px;
            display: flex;
            align-items: center;
            padding: 10px;
            color:rgb(32, 110, 166);
        }

        .cruz{
            background-color: rgb(255, 255, 255);
            color: rgb(209, 48, 77);
            border: 2px solid rgb(32, 110, 166);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-right: 12px;
        }

        .pp{
            display: block;
            color:rgb(184, 225, 241);
        }

    </style>
</head>
