<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.uno{
    background-color:#fffbf6;
    grid-area: uno;
    }
 .dos{
    grid-area: dos;
  background-color: #fffbf6;
 }
 .tres{
    grid-area: tres;
 background-color: #fffbf6;
 }
 .UwU{
    color: linear-gradient(110deg,rgb(32, 110, 166), rgb(184, 225, 241));
    font-size: 50px;
 }
 body{
    display: grid;
    grid-template-rows: 200px 650px 250px ;
    grid-template-columns: 50% 50%;
    grid-template-areas: 
    "uno uno"
    "dos dos"
    "tres tres"
    ;
    padding: 35px;
    background: linear-gradient(110deg,rgb(32, 110, 166), rgb(184, 225, 241));
 }
 @media (max-width:700px) {
   body{
 display: grid;
    grid-template-rows: 300px 800px 300px ;
    grid-template-columns: 33% 33% 34%;
    grid-template-areas: 
    "uno uno uno "
    "dos dos dos"
    "tres cuatro cinco"
    ;
   }
  
 }
 </style>
</head>
<body>
     <header class="uno">1</header>
    <nav class="dos">2</nav>
    <footer class="tres"><p class="UwU">Cuidar, prevenir y acompañar es nuestra forma de enseñar</p></footer>
</body>
</html>
